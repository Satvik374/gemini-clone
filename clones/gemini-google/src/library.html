<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — AI assistant interface</title>
<link rel="preload" href="assets/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>

        <span class="doc-card__name">Design tokens</span>
        <span class="doc-card__meta">Feb 28, 12:43 PM</span>

    <p class="empty">Images and videos you create show up here.</p>

</main>

<script src="api.js"></script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheduled — AI assistant interface</title>
<link rel="preload" href="assets/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="shell.css">
</head>
<body data-page="scheduled">
<div id="shell"></div>

<main class="main" id="main">
  <div class="page">
    <span class="badge">BETA</span>
    <h1 class="page__title">Scheduled</h1>
    <p class="page__sub">Let Gemini handle routines, track updates, and take action for you. <a href="#" style="color:var(--color-link);text-decoration:underline;">Learn more</a></p>

    <h2 class="page__section">Suggested</h2>
    <div class="card-grid">
      <button class="info-card" type="button"><strong>Create a news digest</strong><span>Get a daily deep dive on any topic I'm curious about.</span></button>
      <button class="info-card" type="button"><strong>Build a study quiz</strong><span>Test my knowledge daily with questions on subjects I'm learning.</span></button>
      <button class="info-card" type="button"><strong>Track financial trends</strong><span>Summarize weekly market trends and news in sectors I follow.</span></button>
      <button class="info-card" type="button"><strong>Create a meal plan</strong><span>Set up a weekly meal plan and grocery list for my household.</span></button>
      <button class="info-card" type="button"><strong>Build a competitor digest</strong><span>Curate a weekly digest of what competitors ship.</span></button>
    </div>
  </div>
</main>

<script src="api.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>

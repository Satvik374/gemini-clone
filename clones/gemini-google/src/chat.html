<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation — AI assistant interface</title>
<link rel="preload" href="assets/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="shell.css">
</head>
<body data-page="chat">
<div id="shell"></div>

<main class="main chat-main" id="main">
  <div class="chat-head">Conversation with Gemini</div>

  <div class="turns" id="turns"></div>

  <form class="composer composer--chat" id="chat-form" role="search" aria-label="Ask Gemini">
    <button class="icon-btn composer__plus" type="button" aria-label="Upload &amp; tools">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <label class="sr-only" for="chat-input">Ask Gemini</label>
    <input class="composer__input" id="chat-input" name="prompt" type="text" placeholder="Ask Gemini" autocomplete="off">
    <button class="mode-picker" type="button" aria-label="Open mode picker, currently Auto">
      <span class="mode-picker__label">Auto</span>
      <svg class="chev" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 5.5 6-5.5"/></svg>
    </button>
    <button class="icon-btn composer__mic" type="button" aria-label="Dictate">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></svg>
    </button>
  </form>
</main>

<script src="api.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>

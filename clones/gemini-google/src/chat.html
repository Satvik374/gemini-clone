<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation — AI assistant interface</title>
<link rel="preload" href="assets/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="shell.css">
</head>
<body data-page="chat">
<div id="shell"></div>

<main class="main chat-main" id="main">
  <div class="chat-head">Conversation with Gemini</div>

  <div class="turns" id="turns">
    <article class="turn turn--user">
      <div class="turn__head">
        <span class="turn__label">You said</span>
        <span class="turn__tools">
          <button class="icon-btn icon-btn--xs" type="button" aria-label="Copy prompt">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 5.5A2.5 2.5 0 0 0 13.5 3H6a3 3 0 0 0-3 3v7.5A2.5 2.5 0 0 0 5.5 16"/></svg>
          </button>
          <button class="icon-btn icon-btn--xs" type="button" aria-label="Edit">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>
          </button>
        </span>
      </div>
      <p class="turn__text">hello</p>
    </article>

    <article class="turn turn--model">
      <div class="turn__head"><span class="turn__label">Gemini said</span></div>
      <p class="turn__text">Hi Alex — good to see you. I can help you write, plan, code or dig through a document. What are we working on today?</p>
      <div class="turn__actions">
        <button class="icon-btn icon-btn--xs turn__action" type="button" aria-label="Copy">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 5.5A2.5 2.5 0 0 0 13.5 3H6a3 3 0 0 0-3 3v7.5A2.5 2.5 0 0 0 5.5 16"/></svg>
        </button>
        <button class="icon-btn icon-btn--xs turn__action" type="button" aria-label="Good response">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4v-9z"/><path d="M7 11l4-8a2 2 0 0 1 2 2v4h5a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 16.8 20H7"/></svg>
        </button>
        <button class="icon-btn icon-btn--xs turn__action" type="button" aria-label="Bad response">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 13V4h3v9z"/><path d="M17 13l-4 8a2 2 0 0 1-2-2v-4H6a2 2 0 0 1-2-2.3l1.2-6A2 2 0 0 1 7.2 4H17"/></svg>
        </button>
        <button class="icon-btn icon-btn--xs turn__action" type="button" aria-label="Share">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        </button>
        <button class="icon-btn icon-btn--xs turn__more" type="button" aria-label="More options">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg>
        </button>
      </div>
    </article>
  </div>

  <form class="composer composer--chat" id="chat-form" role="search" aria-label="Ask Gemini">
    <button class="icon-btn composer__plus" type="button" aria-label="Upload &amp; tools">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <label class="sr-only" for="chat-input">Ask Gemini</label>
    <input class="composer__input" id="chat-input" name="prompt" type="text" placeholder="Ask Gemini" autocomplete="off">
    <button class="mode-picker" type="button" aria-label="Open mode picker, currently Flash-Lite">
      <span class="mode-picker__label">Flash-Lite</span>
      <svg class="chev" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 5.5 6-5.5"/></svg>
    </button>
    <button class="icon-btn composer__mic" type="button" aria-label="Dictate">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></svg>
    </button>
  </form>
</main>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>

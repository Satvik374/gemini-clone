          title: Items
          type: array
        query:
          title: Query
          type: string
      required:
      - query
      - items
      title: SearchOut
      type: object
    SettingsOut:
      properties:
        default_model:
          title: Default Model
          type: string
        memory_enabled:
          title: Memory Enabled
          type: boolean
        task_mode:
          enum:
          - chat
          - task
          title: Task Mode
          type: string
        theme:
          enum:
          - system
          - light
          - dark
          title: Theme
          type: string
      required:
      - theme
      - default_model
      - task_mode
      - memory_enabled
      title: SettingsOut
      type: object
    SettingsPatch:
      properties:
        default_model:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Default Model
        memory_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Memory Enabled
        task_mode:
          anyOf:
          - enum:
            - chat
            - task
            type: string
          - type: 'null'
          title: Task Mode
        theme:
          anyOf:
          - enum:
            - system
            - light
            - dark
            type: string
          - type: 'null'
          title: Theme
      title: SettingsPatch
      type: object
    TokenOut:
      properties:
        access_token:
          title: Access Token
          type: string
        expires_in:
          title: Expires In
          type: integer
        token_type:
          const: bearer
          default: bearer
          title: Token Type
          type: string
        user:
          $ref: '#/components/schemas/UserOut'
      required:
      - access_token
      - expires_in
      - user
      title: TokenOut
      type: object
    UserOut:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          title: Email
          type: string

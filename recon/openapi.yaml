          maxLength: 200
          minLength: 8
          title: Password
          type: string
      required:
      - email
      - password
      - name
      title: RegisterIn
      type: object
    SearchItem:
      properties:
        conversation_id:
          title: Conversation Id
          type: string
        snippet:
          title: Snippet
          type: string
